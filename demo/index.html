<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Of Clouds and Clocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --ink: #222; --muted: #666; --panel: rgba(255, 255, 255, 0.94); --line: #ddd; --accent: #8a5a2b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.75 Lora, Georgia, 'Times New Roman', serif; color: var(--ink); background: #faf8f3;
    text-rendering: optimizeLegibility; font-kerning: normal; font-variant-ligatures: common-ligatures; }
  main { max-width: 36rem; margin: 0 auto; padding: 5rem 1.5rem 7rem; }
  /* Keep the text clear of the fixed parameter panel on wide screens. */
  @media (min-width: 900px) { main { margin-left: max(1.5rem, calc((100vw - 36rem - 324px) / 2)); } }
  h1 { font-weight: 400; font-style: italic; font-size: 1.05rem; letter-spacing: 0.02em; color: var(--muted); margin: 0 0 2.5rem; }
  blockquote { margin: 0; position: relative; hanging-punctuation: first; }
  blockquote::before { content: '\201C'; position: absolute; left: -0.55em; top: -0.35em; font-size: 4.5rem; line-height: 1; color: rgba(138, 90, 43, 0.22); }
  blockquote p { margin: 0; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
  blockquote p + p { text-indent: 1.5em; }
  /* Drop cap: the first letter spans three lines, as in print. initial-letter aligns it to the
     baseline grid where supported; elsewhere a float approximates it. */
  /* Fallback size: two line-heights plus the text's cap height (Lora caps ≈ 0.7em) ≈ 6em. */
  .dropcap::first-letter { float: left; font-size: 6em; line-height: 0.78; margin: 0.07em 0.07em 0 0;
    font-weight: 600; color: var(--accent); }
  @supports (initial-letter: 3) or (-webkit-initial-letter: 3) {
    .dropcap::first-letter { float: none; font-size: inherit; line-height: inherit; margin: 0 0.1em 0 0;
      -webkit-initial-letter: 3; initial-letter: 3; }
  }
  /* Text laid out by textwrap.js: each line piece is positioned absolutely inside its paragraph. */
  .tw { position: relative; text-indent: 0 !important; }
  .tw::first-letter { float: none; font-size: inherit; initial-letter: normal; -webkit-initial-letter: normal; color: inherit; font-weight: inherit; }
  .tw-line { position: absolute; white-space: pre; }
  .tw-cap { position: absolute; left: 0; font-weight: 600; color: var(--accent); }
  .elision { text-align: center; text-indent: 0; letter-spacing: 0.6em; color: var(--muted); margin: 1.4rem 0 1.4rem 0.6em; }
  .elision + p { text-indent: 0; }
  figcaption { margin-top: 2.25rem; text-align: right; font-size: 0.95rem; color: var(--muted); }
  figcaption cite { font-style: italic; }
  #panel { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); overflow: auto; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08); }
  #panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  #panel header strong { font-size: 13px; }
  #fps { font-variant-numeric: tabular-nums; color: var(--muted); }
  #panel.collapsed .body { display: none; }
  .row { display: grid; grid-template-columns: 1fr 52px; gap: 2px 6px; align-items: center; margin: 4px 0; }
  .row label { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--muted); }
  .row label.changed { color: var(--accent); font-weight: 600; }
  .row input[type=range] { width: 100%; }
  .row input[type=number], .row select, .row input[type=text] { width: 100%; font: inherit; }
  .inline { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .inline > * { flex: 1; }
  button.small { font: inherit; padding: 3px 8px; cursor: pointer; }
  textarea { width: 100%; height: 90px; font: 11px ui-monospace, Menlo, monospace; resize: vertical; }
  @media (max-width: 640px) { #panel { width: auto; left: 12px; max-height: 45vh; } }
</style>
</head>
<body>
<main>
  <h1>Of Clouds and Clocks</h1>
  <figure style="margin: 0">
    <blockquote>
      <p class="dropcap">There are lots of things, natural processes and natural phenomena, which we may place between these two extremes&mdash;the clouds on the left, and the clocks on the right. The changing seasons are somewhat unreliable clocks, and may therefore be put somewhere towards the right, though not too far. I suppose we shall easily agree to put animals not too far from the clouds on the left, and plants somewhat nearer to the clocks. Among the animals, a young puppy will have to be placed further to the left than an old dog. Motor cars, too, will find their place somewhere in our arrangement, according to their reliability: a Cadillac, I suppose, is pretty far over to the right, and even more so a Rolls-Royce, which will be quite close to the best of the clocks. Perhaps furthest to the right should be placed the solar system.</p>
      <p>As a typical and interesting example of a cloud I shall make some use here of a cloud or cluster of small flies or gnats. Like the individual molecules in a gas, the individual gnats which together form a cluster of gnats move in an astonishingly irregular way. It is almost impossible to follow the flight of any one individual gnat, even though each of them may be quite big enough to be clearly visible.</p>
      <p class="elision" aria-label="passage omitted">&hellip;</p>
      <p>Like many physical, biological, and social systems, the cluster of gnats may be described as a &lsquo;whole&rsquo;. Our conjecture that it is kept together by a kind of attraction which its densest part exerts on individual gnats straying too far from the crowd shows that there is even a kind of action or control which this &lsquo;whole&rsquo; exerts upon its elements or parts. Nevertheless, this &lsquo;whole&rsquo; can be used to dispel the widespread &lsquo;holistic&rsquo; belief that a &lsquo;whole&rsquo; is always more than the mere sum of its parts. I do not deny that it may sometimes be so. Yet the cluster of gnats is an example of a whole that is indeed nothing but the sum of its parts&mdash;and in a very precise sense; for not only is it completely described by describing the movements of all the individual gnats, but the movement of the whole is, in this case, precisely the (vectorial) sum of the movements of its constituent members, divided by the number of the members.</p>
      <p>An example (in many ways similar) of a biological system or &lsquo;whole&rsquo; which exerts some control over the highly irregular movements of its parts would be a picnicking family&mdash;parents with a few children and a dog&mdash;roaming the woods for hours, but never straying far from the family car (which acts like a centre of attraction, as it were). This system may be said to be even more cloudy&mdash;that is, less regular in the movement of its parts&mdash;than our cloud of gnats.</p>
      <p>I hope you will now have before you an idea of my two prototypes or paradigms, the clouds on the left and the clocks on the right, and of the way in which we can arrange many kinds of things, and many kinds of systems, between them. I am sure you have caught some vague, general idea of the arrangement, and you need not worry if your idea is still a bit foggy, or cloudy.</p>
    </blockquote>
    <figcaption>&mdash; Karl Popper, <cite>Of Clouds and Clocks</cite>, Arthur Holly Compton Memorial Lecture, 1965</figcaption>
  </figure>
</main>

<aside id="panel">
  <header>
    <strong>Fly parameters</strong>
    <span id="fps">– fps</span>
    <button class="small" id="collapse" type="button">–</button>
  </header>
  <div class="body">
    <div class="inline">
      <label>renderer <select id="sprite"><option value="auto">sprite (auto)</option><option value="procedural">procedural</option></select></label>
      <label><input type="checkbox" id="debug"> debug</label>
    </div>
    <div class="inline">
      <label>text wrap <select id="wrap"><option value="live">on (text moves around the flies)</option><option value="off">off</option></select></label>
    </div>
    <div class="inline">
      <label>anchor <select id="anchor"><option value="viewport">viewport (stay on screen)</option><option value="page">page (scroll with content)</option></select></label>
    </div>
    <div class="inline">
      <label>seed <input type="text" id="seed" placeholder="random" size="8"></label>
      <button class="small" id="reseed" type="button">restart</button>
      <button class="small" id="reset" type="button">defaults</button>
    </div>
    <div id="sliders"></div>
    <p style="margin: 8px 0 2px; color: var(--muted)">Changed from defaults (copy this to report your tuning):</p>
    <textarea id="changed" readonly></textarea>
  </div>
</aside>

<script src="../dist/fly.js"></script>
<script src="textwrap.js"></script>
<script>
  // Demo options come from the query string (e.g. ?seed=1&attraction=1&debug=true), so
  // the e2e tests and shared links can start from a given configuration.
  const schema = Fly.schema;
  const query = new URLSearchParams(location.search);
  const options = {};
  for (const [key, raw] of query) {
    const spec = schema[key];
    if (!spec) continue;
    if (spec.type === 'number' || spec.type === 'int') options[key] = Number(raw);
    else if (spec.type === 'seed') options[key] = raw === '' || raw === 'null' ? null : Number(raw);
    else if (spec.type === 'bool') options[key] = raw !== 'false';
    else options[key] = raw;
  }
  const swarm = Fly.create(options);
  window.swarm = swarm;

  // Text wrapping around the flies (demo only): ?wrap=live|off, default live.
  const wrapSel = document.getElementById('wrap');
  const wrapMode = query.get('wrap') === 'off' ? 'off' : 'live';
  window.textWrap = createTextWrap({ root: document.querySelector('blockquote'), getSwarm: () => swarm, mode: wrapMode });
  wrapSel.value = wrapMode;
  wrapSel.addEventListener('change', () => window.textWrap.setMode(wrapSel.value));


  const SKIP = new Set(['zIndex']);
  const sliders = document.getElementById('sliders');
  const controls = {};
  const current = () => swarm.debug().params;

  function stepFor(spec) {
    if (spec.type === 'int') return 1;
    const span = spec.max - spec.min;
    return span <= 1 ? 0.01 : span <= 10 ? 0.05 : span <= 100 ? 0.1 : 1;
  }

  for (const [key, spec] of Object.entries(schema)) {
    if ((spec.type !== 'number' && spec.type !== 'int') || SKIP.has(key)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label title="${spec.doc || ''}"><span>${key}</span><span>${spec.min}–${spec.max}</span></label>` +
      `<input type="range"><input type="number">`;
    const [range, number] = row.querySelectorAll('input');
    for (const el of [range, number]) {
      el.min = spec.min;
      el.max = spec.max;
      el.step = stepFor(spec);
      el.addEventListener('input', () => {
        const v = Number(el.value);
        if (Number.isNaN(v)) return;
        swarm.set({ [key]: v });
        refresh();
      });
    }
    controls[key] = { range, number, label: row.querySelector('label'), spec };
    sliders.appendChild(row);
  }

  const debugBox = document.getElementById('debug');
  const anchorSel = document.getElementById('anchor');
  anchorSel.addEventListener('change', () => { swarm.set({ anchor: anchorSel.value }); refresh(); });
  const spriteSel = document.getElementById('sprite');
  const seedBox = document.getElementById('seed');
  debugBox.addEventListener('change', () => { swarm.set({ debug: debugBox.checked }); refresh(); });
  spriteSel.addEventListener('change', () => { swarm.set({ sprite: spriteSel.value }); refresh(); });
  document.getElementById('reseed').addEventListener('click', () => {
    const s = seedBox.value.trim();
    swarm.set({ seed: s === '' ? null : Number(s) });
    refresh();
  });
  document.getElementById('reset').addEventListener('click', () => {
    const defaults = {};
    for (const [key, spec] of Object.entries(schema)) if (key !== 'container') defaults[key] = spec.default;
    swarm.set(defaults);
    seedBox.value = '';
    refresh();
  });
  // On narrow screens the panel would cover the text: start collapsed there.
  if (matchMedia('(max-width: 640px)').matches) {
    document.getElementById('panel').classList.add('collapsed');
    document.getElementById('collapse').textContent = '+';
  }
  document.getElementById('collapse').addEventListener('click', (e) => {
    const p = document.getElementById('panel');
    p.classList.toggle('collapsed');
    e.target.textContent = p.classList.contains('collapsed') ? '+' : '–';
  });

  function refresh() {
    const p = current();
    const changed = {};
    for (const [key, c] of Object.entries(controls)) {
      if (document.activeElement !== c.range) c.range.value = p[key];
      if (document.activeElement !== c.number) c.number.value = p[key];
      const isChanged = p[key] !== c.spec.default;
      c.label.classList.toggle('changed', isChanged);
      if (isChanged) changed[key] = p[key];
    }
    for (const key of ['sprite', 'debug', 'reducedMotion', 'stopDistribution', 'anchor']) {
      if (p[key] !== schema[key].default) changed[key] = p[key];
    }
    debugBox.checked = p.debug;
    anchorSel.value = p.anchor;
    spriteSel.value = p.sprite;
    if (p.seed !== null && document.activeElement !== seedBox) seedBox.value = p.seed;
    document.getElementById('changed').value = Object.keys(changed).length ? JSON.stringify(changed, null, 2) : '(none)';
  }
  refresh();

  setInterval(() => {
    const { fps } = swarm.debug();
    document.getElementById('fps').textContent = fps ? `${fps.toFixed(0)} fps` : '– fps';
  }, 500);
</script>
</body>
</html>
