# Unit and end-to-end tests on every push and pull request. The Python sprite pipeline is not run
# here (too heavy); its outputs in dist/ are committed.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm test
      - name: Committed bundles match the source
        run: |
          npm run build
          git diff --exit-code -- dist/
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
